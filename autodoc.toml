# AutoDOC declared context. Every value is a declaration reviewed against this
# repository's actual content on 2026-10-26; mappings point at files this
# repository owns and the ci-fabric pipeline re-verifies (links gate, versions
# gate, generated-drift gate) on every run.

schema = 1

phase = "beta"
# Matches the project's own honest status (docs/roadmap.md "Status honesty"):
# full gate model implemented and self-tested; signing is BYO-command;
# hosted-CI adapter deliberately deferred; no stage parallelism yet.
phase_declared = "2026-10-26"

profile = "oss-library"
# A public tool others consume (the package installs into consumer repos).

audience = ["contributors", "external-users"]
kinds = ["application"]
# A runnable CLI orchestrator (bin: ./ci), not a library and not a service.

[facts]
# Detection reads the environment; these overrides record why detection is
# wrong or insufficient for this repository, with the reason.
has_env = { value = "false", reason = "ci-fabric reads ambient process variables (PATH, HOME, TZ) but declares its configuration contract as ci.toml; deploy environment variables are explicitly required to arrive via the shell as ${VAR} expansions, and literal credential-shaped values in configuration are rejected at load time." }
has_ai = { value = "false", reason = "No model calls, no training, no AI-shaped files; the orchestrator runs configured shell commands only." }

handles_personal_data = { value = "false", reason = "ci-fabric reads repository files and writes local run state under the repository root; no accounts, no telemetry, no store of personal data." }
handles_payments = { value = "false", reason = "A static CI/CD orchestrator; never touches money, cards, or account data." }
safety_critical = { value = "false", reason = "A wrong or missing gate can block a merge or mislead a reader; it cannot cause physical harm." }

[not_applicable]
# Kind- and trait-gated documents resolved by the declarations above need no
# individual entry; anything else deliberately skipped is recorded here with
# a reason (none today).

