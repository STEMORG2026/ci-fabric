name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: bootstrap toolchain
        run: ./scripts/bootstrap.sh
      - name: create release
        run: ./.venv/bin/python -m ci_fabric --root . release --clean-env --tag
      - name: upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: .localci/releases/