name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # publish the GitHub Release
      id-token: write # cosign keyless OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: verify tag matches VERSION
        env:
          # Env indirection: ref_name is never interpolated into the script.
          TAG: ${{ github.ref_name }}
        run: sh scripts/check-release-tag.sh
      - name: bootstrap toolchain
        run: ./scripts/bootstrap.sh
      - name: create signed release
        env:
          # Per-tag certificate identity (a static ci.toml value cannot match
          # every v* tag). _effective_signer resolves it from the environment
          # and records it in release.json.
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: ./.venv/bin/python -m ci_fabric --root . --clean-env release
      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          bundle=".localci/releases/$version"
          gh release create "$TAG" \
            --title "ci-fabric $version" \
            --notes-file "$bundle/RELEASE_NOTES.md" \
            --verify-tag \
            "$bundle"/*
      - name: upload release bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: .localci/releases/
          if-no-files-found: ignore
