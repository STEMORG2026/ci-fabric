name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The full supported range (requires-python >=3.11). The oldest
        # supported Python runs the canonical full pipeline; newer ones run
        # the test tiers, so interpreter-specific breakage (like CF-01, the
        # 3.11.0-3.11.3 tarfile filter gap) cannot hide behind a single
        # version again.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    name: ci (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: bootstrap toolchain
        env:
          # bootstrap.sh defaults to python3.11; point it at the matrix
          # interpreter so each job tests the version it claims to.
          PYTHON: python${{ matrix.python-version }}
        run: ./scripts/bootstrap.sh
      - name: run canonical pipeline (oldest supported Python)
        if: matrix.python-version == '3.11'
        run: ./.venv/bin/python -m ci_fabric --root . --clean-env ci
      - name: run test tiers (newer Pythons)
        if: matrix.python-version != '3.11'
        run: ./.venv/bin/python -m ci_fabric --root . --clean-env test
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports-py${{ matrix.python-version }}
          path: .ci/reports/
          if-no-files-found: ignore
