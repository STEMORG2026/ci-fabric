name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: bootstrap toolchain
        run: ./scripts/bootstrap.sh
      - name: run canonical pipeline
        run: ./.venv/bin/python -m ci_fabric --root . ci --clean-env
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: .ci/reports/
          if-no-files-found: ignore